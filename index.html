<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imperifansub - Privát Kereső</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', -apple-system, sans-serif; }
        body { background-color: #0d1117; color: #c9d1d9; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .container { width: 100%; max-width: 600px; text-align: center; }
        h1 { font-size: 2.8rem; margin-bottom: 25px; color: #ff4757; font-weight: 700; letter-spacing: -1px; cursor: pointer; }
        .search-box { width: 100%; max-width: 600px; display: flex; background-color: #161b22; border: 2px solid #30363d; border-radius: 50px; padding: 6px 20px; margin-bottom: 25px; }
        .search-box:focus-within { border-color: #ff4757; box-shadow: 0 0 0 3px rgba(255, 71, 87, 0.15); }
        .search-input { flex: 1; background: none; border: none; outline: none; color: #f0f6fc; font-size: 1.1rem; padding: 10px 0; }
        .search-button { background: none; border: none; color: #8b949e; cursor: pointer; padding: 0 10px; font-size: 1.2rem; }
        .search-button:hover { color: #ff4757; }
        .info-msg { font-size: 0.9rem; color: #8b949e; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="container">
        <h1 onclick="location.reload()">IMPERI SEARCH</h1>
        
        <!-- Közvetlen, biztonságos beküldés a DuckDuckGo HTML motorjának -->
        <form action="https://duckduckgo.com" method="GET" target="_blank" class="search-box">
            <input type="text" name="q" class="search-input" placeholder="Biztonságos és privát keresés..." autofocus autocomplete="off">
            
            <!-- Privát paraméterek: Reklámok letiltása (-1), Követés letiltása (-1), Magyar nyelv -->
            <input type="hidden" name="kp" value="-1">
            <input type="hidden" name="kh" value="-1">
            <input type="hidden" name="kl" value="hu-hu">
            
            <button type="submit" class="search-button">🔍</button>
        </form>
        
        <div class="info-msg">Biztonságos indítóoldal: zéró nyomkövetés, reklámmentes találatok új lapon.</div>
    </div>

</body>
</html>
